<div class="min-h-screen bg-charcoal-950 text-ivory">
  <!-- Admin Navigation Header -->
  <header class="glass-nav sticky top-0 z-[100] px-4 md:px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-8">
      <!-- Mobile hamburger -->
      <button
        type="button"
        (click)="toggleMobileMenu()"
        aria-label="Toggle admin menu"
        class="md:hidden flex flex-col justify-center items-center w-9 h-9 gap-[5px] cursor-pointer"
      >
        <span class="block w-5 h-[2px] bg-ivory transition-all" [class.rotate-45]="mobileMenuOpen" [class.translate-y-[7px]]="mobileMenuOpen"></span>
        <span class="block w-5 h-[2px] bg-ivory transition-all" [class.opacity-0]="mobileMenuOpen"></span>
        <span class="block w-5 h-[2px] bg-ivory transition-all" [class.-rotate-45]="mobileMenuOpen" [class.-translate-y-[7px]]="mobileMenuOpen"></span>
      </button>
      <span class="font-display font-extrabold tracking-widest text-lg text-gold-500">
        SWAGGEDUP <span class="text-xs text-charcoal-400 font-normal ml-2">ADMIN</span>
      </span>
      <nav class="hidden md:flex items-center gap-6 text-xs tracking-widest uppercase">
        <a routerLink="/admin/dashboard" routerLinkActive="text-gold-500 font-bold" class="hover:text-gold-500 transition-colors">DASHBOARD</a>
        <a routerLink="/admin/products" routerLinkActive="text-gold-500 font-bold" class="hover:text-gold-500 transition-colors">PRODUCTS</a>
        <a routerLink="/admin/categories" routerLinkActive="text-gold-500 font-bold" class="hover:text-gold-500 transition-colors">CATEGORIES</a>
        <a routerLink="/admin/banners" routerLinkActive="text-gold-500 font-bold" class="hover:text-gold-500 transition-colors">BANNERS</a>
        <a routerLink="/admin/orders" routerLinkActive="text-gold-500 font-bold" class="hover:text-gold-500 transition-colors">ORDERS</a>
        <a routerLink="/admin/inventory" routerLinkActive="text-gold-500 font-bold" class="hover:text-gold-500 transition-colors">INVENTORY</a>
      </nav>
    </div>
    <div class="flex items-center gap-4">
      <a routerLink="/" class="hidden sm:block border border-charcoal-850 hover:border-gold-500 hover:text-gold-500 text-[10px] tracking-widest uppercase px-4 py-2 transition-all cursor-pointer">
        VIEW SHOP
      </a>
      <button 
        (click)="logout()"
        class="bg-gold-500 text-charcoal-900 text-[10px] tracking-widest uppercase font-bold px-4 py-2 hover:bg-gold-600 transition-all cursor-pointer"
      >
        LOGOUT
      </button>
    </div>
  </header>

  <!-- Mobile drawer -->
  <div *ngIf="mobileMenuOpen" class="md:hidden fixed inset-0 z-[150]" (click)="closeMobileMenu()">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
    <nav class="absolute left-0 top-0 h-full w-64 max-w-[80vw] bg-charcoal-900 border-r border-charcoal-800 p-6 flex flex-col gap-1" (click)="$event.stopPropagation()">
      <span class="font-display font-extrabold tracking-widest text-sm text-gold-500 mb-4">MENU</span>
      <a routerLink="/admin/dashboard" routerLinkActive="text-gold-500" (click)="closeMobileMenu()" class="py-3 text-xs tracking-widest uppercase text-ivory hover:text-gold-500 transition-colors border-b border-charcoal-800/60">DASHBOARD</a>
      <a routerLink="/admin/products" routerLinkActive="text-gold-500" (click)="closeMobileMenu()" class="py-3 text-xs tracking-widest uppercase text-ivory hover:text-gold-500 transition-colors border-b border-charcoal-800/60">PRODUCTS</a>
      <a routerLink="/admin/categories" routerLinkActive="text-gold-500" (click)="closeMobileMenu()" class="py-3 text-xs tracking-widest uppercase text-ivory hover:text-gold-500 transition-colors border-b border-charcoal-800/60">CATEGORIES</a>
      <a routerLink="/admin/banners" routerLinkActive="text-gold-500" (click)="closeMobileMenu()" class="py-3 text-xs tracking-widest uppercase text-ivory hover:text-gold-500 transition-colors border-b border-charcoal-800/60">BANNERS</a>
      <a routerLink="/admin/orders" routerLinkActive="text-gold-500" (click)="closeMobileMenu()" class="py-3 text-xs tracking-widest uppercase text-ivory hover:text-gold-500 transition-colors border-b border-charcoal-800/60">ORDERS</a>
      <a routerLink="/admin/inventory" routerLinkActive="text-gold-500" (click)="closeMobileMenu()" class="py-3 text-xs tracking-widest uppercase text-ivory hover:text-gold-500 transition-colors border-b border-charcoal-800/60">INVENTORY</a>
      <a routerLink="/" (click)="closeMobileMenu()" class="py-3 text-xs tracking-widest uppercase text-charcoal-400 hover:text-gold-500 transition-colors border-b border-charcoal-800/60">VIEW SHOP &rarr;</a>
    </nav>
  </div>

  <!-- Content Router Outlet -->
  <main class="max-w-7xl mx-auto py-12 px-6">
    <router-outlet></router-outlet>
  </main>
</div>
