<div class="flex items-center justify-center p-4">
  <div 
    [ngClass]="{
      'w-6 h-6 border-2': size === 'sm',
      'w-10 h-10 border-3': size === 'md',
      'w-16 h-16 border-4': size === 'lg'
    }"
    class="rounded-full border-charcoal-800 border-t-gold-500 animate-spin"
  ></div>
</div>
