<div 
  [routerLink]="['/shop', product.slug]"
  class="group relative flex flex-col cursor-pointer overflow-hidden transition-all duration-300 bg-white"
>
  <!-- Product Image with quick add overlay -->
  <div class="relative aspect-[3/4] overflow-hidden bg-charcoal-900 bg-opacity-[0.03] rounded-sm">
    <img 
      [src]="product.images?.[0] || 'https://images.unsplash.com/photo-1544022613-e87ca75a784a?q=80&w=800'" 
      [alt]="product.name"
      class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
    />
    <!-- Hover second image overlay if available -->
    <img 
      *ngIf="product.images?.[1]"
      [src]="product.images?.[1]" 
      [alt]="product.name"
      class="absolute inset-0 w-full h-full object-cover opacity-0 group-hover:opacity-100 transition-opacity duration-700"
    />
    
    <!-- New Badge -->
    <span *ngIf="product.isNewArrival" class="absolute top-3 left-3 bg-gold-500 text-charcoal-950 font-display text-[9px] font-bold px-2 py-0.5 uppercase tracking-wider">
      NEW
    </span>

    <!-- Quick Add Button Overlay (Slide up on hover) -->
    <div class="absolute inset-x-4 bottom-4 translate-y-12 opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-300 z-10">
      <button 
        (click)="onQuickAdd($event)"
        class="w-full bg-charcoal-300 text-white hover:bg-gold-500 hover:text-charcoal-900 transition-colors text-xs font-bold tracking-widest py-3 uppercase cursor-pointer"
      >
        QUICK ADD
      </button>
    </div>
  </div>

  <!-- Product Metadata -->
  <div class="pt-4 pb-2 flex flex-col">
    <!-- Color dots and Wishlist Heart row -->
    <div class="flex items-center justify-between mb-2">
      <!-- Color circles -->
      <div class="flex gap-1.5 items-center">
        <span 
          [style.backgroundColor]="getColorHex(product.color)" 
          class="w-2.5 h-2.5 rounded-full border border-charcoal-800/10 block shadow-sm"
        ></span>
        <span 
          *ngIf="product.color" 
          [style.backgroundColor]="'#e5e5e7'" 
          class="w-2.5 h-2.5 rounded-full border border-charcoal-800/10 block shadow-sm"
        ></span>
      </div>
      <!-- Wishlist Heart -->
      <button 
        (click)="toggleWishlist($event)"
        class="text-charcoal-400 hover:text-red-500 transition-colors cursor-pointer p-1 -mr-1"
      >
        <svg 
          xmlns="http://www.w3.org/2000/svg" 
          [attr.fill]="isWishlisted ? '#ff3f6c' : 'none'" 
          [attr.stroke]="isWishlisted ? '#ff3f6c' : 'currentColor'" 
          viewBox="0 0 24 24" 
          stroke-width="1.5" 
          class="w-5 h-5 transition-transform duration-200 hover:scale-110"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
        </svg>
      </button>
    </div>

    <!-- Product Title -->
    <h3 class="text-charcoal-300 font-sans text-xs font-bold tracking-wide group-hover:text-gold-500 transition-colors mb-1 truncate">
      {{ product.name }}
    </h3>

    <!-- Brand / Category line -->
    <span class="text-charcoal-400 text-[10px] uppercase tracking-wider mb-2 font-medium">
      {{ product.brand || 'Swagger & Co' }}
    </span>

    <!-- Price line -->
    <div class="flex items-center gap-2">
      <span class="text-charcoal-300 text-xs font-bold">
        {{ displayPrice | currency:'INR':'symbol':'1.0-0' }}
      </span>
      <span class="text-charcoal-500 line-through text-[10px]" *ngIf="product.basePrice > displayPrice">
        {{ product.basePrice | currency:'INR':'symbol':'1.0-0' }}
      </span>
    </div>
  </div>
</div>
