<header class="glass-nav sticky top-0 z-[999] px-6 py-4 flex items-center justify-between transition-all duration-300">
  
  <!-- Mobile Navbar Layout (Hidden on Desktop) -->
  <div class="w-full flex items-center justify-between lg:hidden">
    <!-- Menu Hamburger Toggle -->
    <button 
      (click)="toggleMobileMenu()" 
      class="text-charcoal-300 hover:text-gold-500 transition-colors cursor-pointer p-1"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>

    <!-- Center Logo -->
    <a routerLink="/" class="font-display font-black tracking-[0.3em] text-lg text-ivory hover:text-gold-500 transition-colors">
      SWAGGEDUP
    </a>

    <!-- Right Cart Trigger -->
    <button 
      (click)="cartService.toggleCart()" 
      class="relative flex items-center text-ivory hover:text-gold-500 transition-colors cursor-pointer p-1"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
      </svg>
      <div 
        *ngIf="cartService.getItemCount() > 0" 
        class="absolute -top-1 -right-1 bg-gold-500 text-charcoal-900 font-bold text-[8px] w-4.5 h-4.5 rounded-full flex items-center justify-center border border-white shadow-sm animate-fade-in"
      >
        {{ cartService.getItemCount() }}
      </div>
    </button>
  </div>

  <!-- Desktop Navbar Layout (Hidden on Mobile) -->
  <div class="hidden lg:flex w-full items-center justify-between">
    <!-- Left Logo -->
    <a routerLink="/" class="font-display font-black tracking-[0.3em] text-xl text-ivory hover:text-gold-500 transition-colors">
      SWAGGEDUP
    </a>
    
    <!-- Center Nav Links -->
    <nav class="flex items-center gap-8 text-xs tracking-widest uppercase font-semibold mx-auto">
      <a routerLink="/" routerLinkActive="text-gold-500 font-bold" [routerLinkActiveOptions]="{exact: true}" class="hover:text-gold-500 transition-colors">HOME</a>
      <a routerLink="/shop" routerLinkActive="text-gold-500 font-bold" [routerLinkActiveOptions]="{exact: true}" class="hover:text-gold-500 transition-colors">SHOP</a>
      <a routerLink="/shop" [queryParams]="{ category: 'coats-jackets' }" class="hover:text-gold-500 transition-colors">JACKETS</a>
      <a routerLink="/shop" [queryParams]="{ category: 'suits-blazers' }" class="hover:text-gold-500 transition-colors">SUITS</a>
      <a routerLink="/shop" [queryParams]="{ sort: 'newest' }" class="hover:text-gold-500 transition-colors">NEW ARRIVALS</a>
    </nav>

    <!-- Right Actions -->
    <div class="flex items-center gap-6">
      
      <!-- Interactive Search Bar -->
      <div class="relative flex items-center border-b border-charcoal-800/40 pb-0.5 focus-within:border-gold-500 transition-all">
        <input 
          type="text" 
          placeholder="SEARCH..." 
          [(ngModel)]="searchQuery" 
          (keyup.enter)="triggerSearch()"
          class="bg-transparent border-none text-[10px] tracking-wider text-charcoal-300 placeholder-charcoal-500 w-32 focus:outline-none focus:ring-0 px-1 py-0 uppercase"
        />
        <button (click)="triggerSearch()" class="text-charcoal-400 hover:text-gold-500 transition-colors cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.602 10.602Z" />
          </svg>
        </button>
      </div>

      <!-- Account (Admin portal / login) -->
      <a routerLink="/admin/login" title="Staff Login" class="text-charcoal-300 hover:text-gold-500 transition-colors flex items-center gap-1.5 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
        </svg>
      </a>

      <!-- Wishlist with badge -->
      <button routerLink="/shop" [queryParams]="{ filter: 'wishlist' }" title="View Wishlist" class="relative text-charcoal-300 hover:text-gold-500 transition-colors cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
        </svg>
        <div 
          *ngIf="wishlistService.getCount() > 0" 
          class="absolute -top-1 -right-1 bg-red-500 text-white font-bold text-[8px] w-4 h-4 rounded-full flex items-center justify-center shadow-sm animate-fade-in"
        >
          {{ wishlistService.getCount() }}
        </div>
      </button>

      <!-- Cart Trigger with Badge -->
      <button 
        (click)="cartService.toggleCart()" 
        class="relative flex items-center gap-1.5 text-ivory hover:text-gold-500 transition-colors cursor-pointer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
        </svg>
        <span class="text-[10px] tracking-widest uppercase font-semibold">BAG</span>
        <div 
          *ngIf="cartService.getItemCount() > 0" 
          class="bg-gold-500 text-charcoal-900 font-bold text-[9px] w-5 h-5 rounded-full flex items-center justify-center border border-white shadow-sm animate-fade-in"
        >
          {{ cartService.getItemCount() }}
        </div>
      </button>

    </div>
  </div>
</header>

<!-- Mobile Menu Drawer (Toggles on button click) -->
<div 
  *ngIf="mobileMenuOpen" 
  class="fixed inset-0 z-[1000] bg-charcoal-950/40 backdrop-blur-sm lg:hidden animate-fade-in"
  (click)="toggleMobileMenu()"
>
  <div 
    class="w-64 max-w-[80vw] h-full bg-white shadow-2xl p-6 flex flex-col gap-6"
    (click)="$event.stopPropagation()"
  >
    <!-- Mobile Menu Close Header -->
    <div class="flex items-center justify-between border-b border-charcoal-800/10 pb-4">
      <span class="font-display font-black tracking-[0.2em] text-base text-ivory">SWAGGEDUP</span>
      <button (click)="toggleMobileMenu()" class="text-charcoal-400 hover:text-gold-500 font-bold text-lg">&times;</button>
    </div>

    <!-- Links List -->
    <nav class="flex flex-col gap-4 text-xs tracking-widest uppercase font-semibold">
      <a routerLink="/" (click)="toggleMobileMenu()" class="hover:text-gold-500 py-1 transition-colors">HOME</a>
      <a routerLink="/shop" (click)="toggleMobileMenu()" class="hover:text-gold-500 py-1 transition-colors">SHOP</a>
      <a routerLink="/shop" [queryParams]="{ category: 'coats-jackets' }" (click)="toggleMobileMenu()" class="hover:text-gold-500 py-1 transition-colors">JACKETS</a>
      <a routerLink="/shop" [queryParams]="{ category: 'suits-blazers' }" (click)="toggleMobileMenu()" class="hover:text-gold-500 py-1 transition-colors">SUITS</a>
      <a routerLink="/shop" [queryParams]="{ sort: 'newest' }" (click)="toggleMobileMenu()" class="hover:text-gold-500 py-1 transition-colors">NEW ARRIVALS</a>
      <a routerLink="/admin/login" (click)="toggleMobileMenu()" class="hover:text-gold-500 py-1 border-t border-charcoal-800/10 pt-4 text-[10px]">ADMIN PORTAL</a>
    </nav>
  </div>
</div>
