<div class="fixed top-24 right-6 z-[99999] flex flex-col gap-3 w-full max-w-sm">
  <div 
    *ngFor="let t of toasts"
    [ngClass]="{
      'border-green-500 bg-charcoal-900 text-green-500 shadow-[0_0_15px_rgba(34,197,94,0.15)]': t.type === 'success',
      'border-red-500 bg-charcoal-900 text-red-500 shadow-[0_0_15px_rgba(239,68,68,0.15)]': t.type === 'error',
      'border-gold-500 bg-charcoal-900 text-gold-500 shadow-[0_0_15px_rgba(197,168,128,0.15)]': t.type === 'info'
    }"
    class="border p-4 flex items-center justify-between text-xs tracking-wider uppercase font-semibold animate-fade-in relative"
  >
    <div class="flex items-center gap-3">
      <span class="text-sm font-extrabold" *ngIf="t.type === 'success'">&#10003;</span>
      <span class="text-sm font-extrabold" *ngIf="t.type === 'error'">&#9888;</span>
      <span class="text-sm font-extrabold" *ngIf="t.type === 'info'">&#9432;</span>
      <span>{{ t.message }}</span>
    </div>
    <button (click)="removeToast(t.id)" class="text-charcoal-400 hover:text-ivory ml-4 text-sm font-bold cursor-pointer">
      &times;
    </button>
  </div>
</div>
