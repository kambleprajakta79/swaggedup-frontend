<div *ngIf="type === 'grid'" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-8 w-full">
  <div *ngFor="let idx of arrayFromCount" class="animate-pulse flex flex-col border border-charcoal-850 bg-charcoal-900/40 p-4 gap-4">
    <div class="aspect-[3/4] w-full bg-charcoal-800"></div>
    <div class="h-4 bg-charcoal-850 w-2/3 rounded"></div>
    <div class="h-3 bg-charcoal-850 w-1/2 rounded"></div>
    <div class="flex justify-between items-center mt-2">
      <div class="h-4 bg-charcoal-850 w-1/4 rounded"></div>
      <div class="h-3 bg-charcoal-850 w-1/3 rounded"></div>
    </div>
  </div>
</div>

<div *ngIf="type === 'card'" class="animate-pulse flex flex-col border border-charcoal-850 bg-charcoal-900/40 p-4 gap-4 w-full">
  <div class="aspect-[3/4] w-full bg-charcoal-800"></div>
  <div class="h-4 bg-charcoal-850 w-2/3 rounded"></div>
  <div class="h-3 bg-charcoal-850 w-1/2 rounded"></div>
  <div class="flex justify-between items-center mt-2">
    <div class="h-4 bg-charcoal-850 w-1/4 rounded"></div>
    <div class="h-3 bg-charcoal-850 w-1/3 rounded"></div>
  </div>
</div>

<div *ngIf="type === 'list'" class="space-y-4 w-full">
  <div *ngFor="let idx of arrayFromCount" class="animate-pulse flex items-center justify-between p-4 border border-charcoal-850 bg-charcoal-900/20 rounded">
    <div class="flex items-center gap-4">
      <div class="w-16 h-16 bg-charcoal-800 rounded"></div>
      <div class="space-y-2">
        <div class="h-4 bg-charcoal-850 w-32 rounded"></div>
        <div class="h-3 bg-charcoal-850 w-24 rounded"></div>
      </div>
    </div>
    <div class="h-4 bg-charcoal-850 w-16 rounded"></div>
  </div>
</div>
